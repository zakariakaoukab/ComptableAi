# ============================================================
# FiduIA — Docker Compose (Développement Local)
# ============================================================
# Services : PostgreSQL 15 (db) + API FastAPI (api)
# Usage   : docker-compose up --build
# ============================================================

services:
  # ---- Service Base de Données PostgreSQL ----
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiduia_user
      POSTGRES_PASSWORD: fiduia_pass
      POSTGRES_DB: fiduia_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiduia_user -d fiduia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Service API FastAPI ----
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/stockage_fichiers
      - ./app:/app/app
    env_file:
      - .env

# ---- Volumes nommés ----
volumes:
  pgdata:
